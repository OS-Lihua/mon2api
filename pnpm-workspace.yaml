allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: false
  core-js: true
  esbuild: true
  # Use the package's JavaScript fallback; no native build is needed.
  keccak: false
  lefthook: true
  prisma: true
  sharp: true
  utf-8-validate: false

minimumReleaseAgeExclude:
  - undici@8.12.3

# Security fixes for versions pinned by Next 15 and Prisma 6. Remove these
# overrides when the upstream packages require patched versions themselves.
overrides:
  'next>postcss': ^8.5.28
  '@prisma/config>deepmerge-ts': ^8.0.0

  # Patched transitive production dependencies from the security audit.
  fast-uri: ^3.1.8
  'brace-expansion@>=4.0.0': ^5.0.12
  dompurify: ^3.4.16
  source-map-js: ^1.2.2
  sharp: ^0.35.5
  'ws@>=8.0.0': ^8.21.0
  'uuid@>=8.0.0 <11.1.1': ^11.1.1
  decode-uri-component: ^0.5.0
  use-sync-external-store: ^1.6.0

  # Restrict these patches to the vulnerable development dependency ranges.
  'tmp@>=0.2.6 <0.2.7': 0.2.7
  'vite@>=8.0.0 <8.1.6': 8.1.6
