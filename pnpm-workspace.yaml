allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: false
  core-js: true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  utf-8-validate: false

# Security fixes for versions pinned by Next 15 and Prisma 6. Remove these
# overrides when the upstream packages require patched versions themselves.
overrides:
  'next>postcss': ^8.5.28
  '@prisma/config>deepmerge-ts': ^8.0.0

  # Patched transitive production dependencies from the security audit.
  fast-uri: ^3.1.8
  'brace-expansion@>=4.0.0': ^5.0.12
  dompurify: ^3.4.16
  source-map-js: ^1.2.2
  sharp: ^0.35.5
