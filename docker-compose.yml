name: token2api
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: token2api
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d token2api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
