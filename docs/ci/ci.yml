name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: token2api_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d token2api_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:local_ci_only@localhost:5432/token2api_ci
      APP_ENV: test
      TOKEN2API_MODE: local
      ALLOW_DEMO: "true"
      APP_ORIGIN: http://localhost:3000
      SESSION_PASSWORD: local-ci-only-not-a-deployment-secret-000000000000
      LOG_LEVEL: warn
      RATE_LIMIT_REQUESTS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Apply migrations twice to check repeatability
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          pnpm db:seed
      - name: Check, types, unit and contract tests, production build
        run: pnpm verify
      - name: Test production HTTP and ledger recovery on local EVM
        run: |
          pnpm preview:local > /tmp/token2api-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"; cat /tmp/token2api-preview.log' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/openapi.json > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
          TOKEN2API_RECOVERY_TEST=true pnpm test:recovery
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone web image without deployment credentials
        run: docker build --target runner -t token2api-ci .
